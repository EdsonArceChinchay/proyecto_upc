# Habilita o deshabilita el registro de las transacciones en un excel.
# Valores posibles:
#   - true: Enviar detalle de la ejecución.
#   - false: No enviar detalle de la ejecución.
environment.generateBitacora=true

###########################################################################
##          CONFIGURACIÓN DE ENVÍO DE NOTIFICACIONES POR WHATSAPP        ##
###########################################################################

# Habilita o deshabilita el envío del detalle de ejecución del feature.
# Valores posibles:
#   - true: Enviar detalle de la ejecución.
#   - false: No enviar detalle de la ejecución.
environment.notification.sendStatus=false

# Especifica el entorno de ejecución.
# Valores posibles:
#   - Test: Para pruebas.
#   - Prod: Para ejecuciones en producción.
environment.notification.env=Test

# Habilita o deshabilita el envío del reporte final de la ejecución.
# Valores posibles:
#   - true: Enviar reporte final.
#   - false: No enviar reporte final.
environment.notification.sendReporte=false

# Identificador único basado en la clave del HU (Historia de Usuario).
# Este identificador agrupa las ejecuciones y debe estar presente en cada feature.
# Ejemplo: TIQLT-1234
environment.notification.huKey=TIQLT-JR1220

# Lista de números de WhatsApp a los que se enviará el reporte.
# Los números deben incluir el código de país (ejemplo: 51 para Perú) y terminar con @c.us.
# Para grupos de WhatsApp, utiliza @g.us al final.
# Separa múltiples números por comas, sin espacios.
# Ejemplo:
#   - Número personal: 51999999999@c.us
#   - Grupo: 120363231259999999@g.us
environment.notification.number=51923094244@c.us

###########################################################################
##        FIN - CONFIGURACIÓN DE ENVÍO DE NOTIFICACIONES POR WHATSAPP    ##
###########################################################################
